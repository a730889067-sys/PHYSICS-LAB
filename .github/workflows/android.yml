name: Build PHYSICS-LAB Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "source-zip-parts/**"
      - ".github/workflows/android.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Reassemble and extract source
        shell: bash
        run: |
          set +e
          cat source-zip-parts/part-*.bin > "$RUNNER_TEMP/PHYSICS-LAB_SOURCE.zip"
          unzip -oq "$RUNNER_TEMP/PHYSICS-LAB_SOURCE.zip" -d "$RUNNER_TEMP/source"
          unzip_status=$?
          set -e

          project="$RUNNER_TEMP/source/PHYSICS-LAB_SOURCE"
          if [ ! -f "$project/app/src/main/AndroidManifest.xml" ] && [ -f "$project/app/src/main/AndroidManidest.xml" ]; then
            mv "$project/app/src/main/AndroidManidest.xml" "$project/app/src/main/AndroidManifest.xml"
          fi

          test -s "$project/settings.gradle"
          test -s "$project/build.gradle"
          test -s "$project/app/build.gradle"
          test -s "$project/app/src/main/AndroidManifest.xml"
          test -s "$project/app/src/main/assets/index.html"
          test -s "$project/app/src/main/java/com/physicslab/app/MainActivity.java"

          if [ "$unzip_status" -ne 0 ]; then
            echo "ZIP reported a local filename warning, but all required source files were extracted and verified."
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ runner.temp }}/source/PHYSICS-LAB_SOURCE
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHYSICS-LAB-debug-apk
          path: ${{ runner.temp }}/source/PHYSICS-LAB_SOURCE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
