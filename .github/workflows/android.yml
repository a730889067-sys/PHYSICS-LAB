name: Build PHYSICS-LAB Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "source-zip-parts/**"
      - ".github/workflows/android.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Reassemble source archive
        run: |
          cat source-zip-parts/part-*.bin > "$RUNNER_TEMP/PHYSICS-LAB_SOURCE.zip"
          unzip -t "$RUNNER_TEMP/PHYSICS-LAB_SOURCE.zip"
          unzip -q "$RUNNER_TEMP/PHYSICS-LAB_SOURCE.zip" -d "$RUNNER_TEMP/source"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ runner.temp }}/source/PHYSICS-LAB_SOURCE
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHYSICS-LAB-debug-apk
          path: ${{ runner.temp }}/source/PHYSICS-LAB_SOURCE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
